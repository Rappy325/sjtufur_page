name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build mixed site
        shell: bash
        run: |
          rm -rf public
          mkdir -p public

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'hugo' \
            --exclude 'public' \
            ./ public/

          hugo \
            --source ./hugo \
            --destination "${GITHUB_WORKSPACE}/public/blog" \
            --baseURL "https://rappy325.github.io/sjtufur_page/blog/" \
            --minify

          touch public/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
